<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pediatric OSCE Simulator (Year 5)</title>
    <meta name="description" content="High-fidelity Year 5 Paediatric OSCE clinical exam simulator with simulated Malaysian parent personas, live voice dialogue, and 20-mark consultant paediatrician examiner evaluation.">
    <meta property="og:title" content="Pediatric OSCE Simulator (Year 5)">
    <meta property="og:description" content="High-fidelity Year 5 Paediatric OSCE clinical exam simulator with simulated Malaysian parent personas, live voice dialogue, and 20-mark consultant paediatrician examiner evaluation.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <!-- LOAD CATALOG & TRANSCRIPT SCRIPT WITH CACHE BUSTING -->
    <script src="./stations.js?v=3"></script>
    <script src="./transcript.js?v=1"></script>
</head>
<body>
    <div class="container">
        <!-- TOP HEADER -->
        <header>
            <div class="header-left">
                <h1>Pediatric OSCE</h1>
                <span class="version-tag">Build 3.0</span>
                <select class="station-select" id="station-select" onchange="onStationChanged(this.value)"></select>
                <span class="exam-lock-banner" id="exam-lock-banner">🔒 EXAM ASSIGNED: <span id="locked-station-name"></span></span>
            </div>
            
            <div class="header-controls">
                <!-- MODEL SELECTOR -->
                <div class="model-select-wrapper" title="Select Gemini Model for roleplay & examiner evaluation">
                    <label for="model-select" class="header-label">Model:</label>
                    <select id="model-select" class="model-select" onchange="onModelSelected(this.value)">
                        <option value="gemini-3.8-flash">gemini-3.8-flash (Recommended)</option>
                        <option value="gemini-3.5-flash">gemini-3.5-flash</option>
                        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
                        <option value="gemini-flash-latest">gemini-flash-latest</option>
                        <option value="gemini-4-argon">gemini-4-argon</option>
                        <option value="custom">Custom model...</option>
                    </select>
                    <input type="text" id="custom-model-input" class="custom-model-input" placeholder="e.g. gemini-3.8-flash" oninput="onCustomModelInput(this.value)">
                </div>

                <!-- GEMINI API KEY BOX FOR GITHUB PAGES -->
                <div class="key-wrapper" id="key-wrapper" title="Enter your Gemini API key to enable direct AI roleplay & examiner evaluation on GitHub Pages">
                    <input type="password" id="gemini-api-key" placeholder="Gemini API Key..." oninput="onApiKeyInput(this.value)" autocomplete="off">
                    <button type="button" class="btn-toggle-key" id="btn-toggle-key" onclick="toggleApiKeyVisibility()" title="Show/Hide API Key">👁️</button>
                    <button type="button" class="btn-save-key" id="btn-save-key" onclick="saveApiKey()">Save</button>
                </div>

                <button class="btn-danger" id="btn-end" onclick="endStation()">End Station</button>
                <div class="timer-badge" id="timer-display">10:00</div>
            </div>
        </header>

        <!-- TOP PANEL -->
        <div class="top-panel" id="top-panel">
            <div class="instruction-card" id="instruction-content">
                <h2 id="station-title">Loading Station...</h2>
                <p id="station-brief"></p>
                <p><strong>Your Tasks:</strong> <span id="station-tasks"></span></p>
                <div class="start-bar">
                    <div class="student-entry">
                        <label for="candidate-id">Student Name / ID:</label>
                        <input type="text" id="candidate-id" placeholder="e.g. Dr. Sarah / Matric 210045" oninput="saveCandidateId()">
                    </div>
                    <button class="btn-success" id="btn-start" onclick="startStation()">▶ Start Consultation</button>
                </div>
            </div>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-container">
            <!-- LIVE VOICE ACTIVE STATUS BANNER -->
            <div class="live-status-banner" id="live-status-banner">
                <div class="live-status-left">
                    <span class="live-pulse-dot"></span>
                    <span class="live-badge">LIVE VOICE ACTIVE</span>
                    <span id="live-status-desc">Hands-free dialogue active. Speak to Puan Siti in Malaysian English.</span>
                </div>
                <div class="live-controls">
                    <button type="button" class="btn-live-sub" id="btn-live-mute" onclick="toggleLiveMute()">Mic On</button>
                    <button type="button" class="btn-live-sub btn-live-stop" onclick="stopLiveVoice()">End Live</button>
                </div>
            </div>

            <div class="transcript-box" id="transcript">
                <div class="msg msg-system" id="system-welcome">Loading...</div>
            </div>

            <!-- Active Input Bar -->
            <div class="input-bar">
                <button type="button" class="btn-live" id="btn-live" onclick="toggleLiveVoice()" title="Toggle hands-free live spoken consultation (continuous voice dialogue)">
                    <span class="live-indicator-dot"></span>
                    <span id="btn-live-text">🔴 Live Voice</span>
                </button>
                <button type="button" class="btn-mic" id="btn-mic" onclick="toggleMic()">🎤 Speak</button>
                <textarea id="doctor-input" placeholder="Type or click 'Speak' / 'Live Voice' to consult... (Press Enter to Send)" onkeydown="handleKeyPress(event)"></textarea>
                <button type="button" class="btn-primary btn-send" id="btn-send" onclick="sendMessage()">Send</button>
            </div>
            <div class="status-text" id="status-text">Ready. Please enter your Student Name/ID and click 'Start Consultation' to begin.</div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
